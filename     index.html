<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma Caisse - Clients & Crédits</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#1769aa;--bg:#f3f6f9;--card:#fff;--text:#263238;--muted:#607d8b;--danger:#c62828;--ok:#2e7d32;--line:#e1e7eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--p);color:#fff;padding:14px 16px}header .top{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{margin:0;font-size:22px}header span{font-size:13px;opacity:.9}.head-actions{display:flex;gap:7px}.head-actions button{background:#fff;color:var(--p);border:0;border-radius:9px;padding:8px 11px;font-weight:700}
main{max-width:1150px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #00000010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #ccd6dd}button{border:0;background:var(--p);color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#607d8b}button.light{background:#eef3f7;color:#263238}button.danger{background:var(--danger)}button.success{background:var(--ok)}button:disabled{opacity:.5}
.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{font-size:13px;padding:9px 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:12px;background:#eef5fb}.stat b{display:block;font-size:20px;margin-top:4px}
.searchbox{display:grid;grid-template-columns:2fr 1fr;gap:10px}.client-card{padding:16px}.client{padding:16px 0;border-bottom:1px solid var(--line)}.client:first-child{padding-top:0}.client:last-child{border-bottom:0;padding-bottom:0}.client h3{margin:0 0 3px;font-size:20px}.client .meta{color:var(--muted);margin-bottom:10px}.client .amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}.amount{padding:9px 10px;border-radius:10px;background:#f7f9fb}.amount b{display:block;font-size:17px;margin-top:2px}
.login{max-width:430px;margin:40px auto}.msg{display:none!important;padding:10px;border-radius:9px;margin:10px 0;background:#fff3cd;min-height:0!important;height:auto}.msg.show{display:block!important}.success{background:#e8f5e9;color:#1b5e20}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal>div{background:#fff;border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}.hidden{display:none!important}.muted{color:var(--muted)}.section-title{font-size:24px;margin:0 0 14px}footer{text-align:center;color:#777;padding:10px 16px 25px}
@media(max-width:700px){main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.searchbox{grid-template-columns:1fr}.client .amounts{grid-template-columns:1fr}header .top{align-items:flex-start}.head-actions{flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body>
<header><div class="top">
  <div><h1>Ma Caisse</h1><span>Clients, crédits et paiements</span></div>
  <div class="head-actions">
    <button onclick="exporter()">Exporter</button>
    <button onclick="document.getElementById('file').click()">Importer</button>
    <input id="file" type="file" accept=".json" class="hidden" onchange="importer(event)">
  </div>
</div></header>

<div id="loginView" class="login card">
  <h2>Connexion Ma Caisse</h2>
  <p class="muted">Connecte-toi avec ton compte Supabase.</p>
  <div class="grid"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe"></div>
  <br><button onclick="login()">Se connecter</button>
  <div id="loginMsg" class="msg" aria-live="polite"></div>
</div>

<main id="appView" class="hidden">
  <div class="card">
    <div class="actions">
      <button onclick="showAdd()">+ Nouveau client</button><button class="secondary" onclick="loadData()">↻ Actualiser</button>
      <button class="light" onclick="syncLocal()">⬆ Importer anciennes données</button><button class="danger" onclick="logout()">Déconnexion</button>
    </div>
    <div id="userInfo" class="muted" style="margin-top:10px"></div><div id="msg" class="msg"></div>
  </div>

  <div class="card"><div class="stats">
    <div class="stat">Clients<b id="nbClients">0</b></div><div class="stat">Crédit total<b id="totalCredit">0,00 DH</b></div>
    <div class="stat">Total payé<b id="totalPaye">0,00 DH</b></div><div class="stat">Reste à payer<b id="totalReste">0,00 DH</b></div>
  </div></div>

  <div class="card"><div class="searchbox">
    <input id="search" placeholder="🔎 Rechercher un client..." oninput="render()">
    <select id="filter" onchange="render()"><option value="all">Tous les clients</option><option value="reste">Avec reste</option><option value="solde">Soldés</option></select>
  </div></div>

  <div class="card">
    <h2 class="section-title">Ajouter un client</h2>
    <div class="grid"><input id="newName" placeholder="Nom du client *"><input id="newTel" placeholder="Téléphone"><input id="newAddress" placeholder="Adresse"><input id="newCredit" type="number" min="0" step="0.01" placeholder="Crédit initial (DH)"></div>
    <br><button class="success" onclick="saveInlineClient()">+ Ajouter</button>
  </div>

  <div class="card client-card"><h2 class="section-title">Liste des clients</h2><div id="clientList"></div></div>
</main>

<div id="modal" class="modal hidden"><div id="modalBody"></div></div>
<footer>Ma Caisse — Clients, crédits et paiements</footer>

<script>
const SUPABASE_URL = "https://zwknoefaoplxfzogjtvr.supabase.co";
const SUPABASE_KEY = "sb_publishable_3-RWXCKDYVOOpVhIyn56qw_LjWxjT-r";
const sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const LOCAL_KEY="ma_caisse_vfinal_1";
let clients=[], payments=[], editingId=null;

function money(n){return Number(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" DH"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function showMsg(t,ok=false){let e=document.getElementById("msg");e.textContent=t;e.className="msg show"+(ok?" success":"");}
function loginMsg(t){let e=document.getElementById("loginMsg");e.textContent=t||"";e.className=t?"msg show":"msg"}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function openModal(html){document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function localData(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]")}catch{return[]}}

async function login(){
 const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
 if(!email||!password)return loginMsg("Entre ton email et ton mot de passe.");
 loginMsg("Connexion...");
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error)return loginMsg(error.message);
}
async function logout(){
 clients=[]; payments=[];
 document.getElementById("rows").innerHTML="";
 document.getElementById("nbClients").textContent="0";
 document.getElementById("totalCredit").textContent=money(0);
 document.getElementById("totalPaye").textContent=money(0);
 document.getElementById("totalReste").textContent=money(0);
 document.getElementById("userInfo").textContent="";
 document.getElementById("search").value="";
 closeModal();
 await sb.auth.signOut();
}
async function init(){
 const {data:{session}}=await sb.auth.getSession();
 sb.auth.onAuthStateChange((_e,s)=>setAuth(s));
 setAuth(session);
}
async function setAuth(session){
 if(session){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  document.getElementById("userInfo").textContent="Connecté : "+(session.user.email||"");
  await loadData();
 }else{
  document.getElementById("loginView").classList.remove("hidden");
  document.getElementById("appView").classList.add("hidden");
 }
}
async function loadData(){
 const {data:cs,error:ce}=await sb.from("clients").select("*").order("created_at",{ascending:true});
 if(ce){showMsg("Erreur clients : "+ce.message);return}
 const {data:ps,error:pe}=await sb.from("paiements").select("*").order("date_paiement",{ascending:false});
 if(pe){showMsg("Erreur paiements : "+pe.message);return}
 clients=cs||[];payments=ps||[];render();showMsg("Données synchronisées.",true)
}
function sums(c){let p=payments.filter(x=>x.client_id===c.id).reduce((a,x)=>a+Number(x.montant||0),0);return {p,r:Math.max(0,Number(c.credit_initial||0)-p)}}
function render(){
  const q=document.getElementById("search").value.toLowerCase(), f=document.getElementById("filter").value;
  let arr=clients.filter(c=>(c.nom+" "+(c.tel||"")+" "+(c.adresse||"")).toLowerCase().includes(q));
  arr=arr.filter(c=>{let s=sums(c);return f==="all"||(f==="reste"&&s.r>0.001)||(f==="solde"&&s.r<=0.001)});
  document.getElementById("clientList").innerHTML=arr.map(c=>{
    let s=sums(c);
    return `<div class="client">
      <h3>${esc(c.nom)}</h3><div class="meta">${esc(c.adresse||"")}${c.tel?" · "+esc(c.tel):""}</div>
      <div class="amounts"><div class="amount">Crédit<b>${money(c.credit_initial)}</b></div><div class="amount">Payé<b>${money(s.p)}</b></div><div class="amount">Reste<b>${money(s.r)}</b></div></div>
      <div class="actions"><button onclick="addCredit(${c.id})">+ Crédit</button><button onclick="addPayment(${c.id})">+ Paiement</button><button class="secondary" onclick="history(${c.id})">Historique</button><button class="light" onclick="editClient(${c.id})">Modifier</button><button class="light" onclick="receipt(${c.id})">Reçu</button><button class="danger" onclick="deleteClient(${c.id})">Supprimer</button></div>
    </div>`;
  }).join("") || `<p class="muted">Aucun client</p>`;
  document.getElementById("nbClients").textContent=clients.length;
  let tc=clients.reduce((a,c)=>a+Number(c.credit_initial||0),0),tp=payments.reduce((a,p)=>a+Number(p.montant||0),0);
  document.getElementById("totalCredit").textContent=money(tc);document.getElementById("totalPaye").textContent=money(tp);document.getElementById("totalReste").textContent=money(Math.max(0,tc-tp));
}
function saveInlineClient(){
  const nom=document.getElementById("newName").value.trim(),tel=document.getElementById("newTel").value.trim(),adresse=document.getElementById("newAddress").value.trim(),credit=Number(document.getElementById("newCredit").value||0);
  if(!nom)return alert("Le nom est obligatoire.");
  saveInlineClientRemote(nom,tel,adresse,credit);
}
async function saveInlineClientRemote(nom,tel,adresse,credit){
  const {error}=await sb.from("clients").insert({nom,tel,adresse,credit_initial:credit});
  if(error)return alert(error.message);
  ["newName","newTel","newAddress","newCredit"].forEach(id=>document.getElementById(id).value="");
  await loadData();
}

function showAdd(){editingId=null;openModal(`<h2>Nouveau client</h2><div class="grid"><input id="n" placeholder="Nom *"><input id="t" placeholder="Téléphone"><input id="a" placeholder="Adresse"><input id="c" type="number" min="0" step="0.01" placeholder="Crédit initial"></div><br><div class="actions"><button onclick="saveClient()">Enregistrer</button><button class="light" onclick="closeModal()">Annuler</button></div>`)}
async function saveClient(){
 let nom=document.getElementById("n").value.trim(),tel=document.getElementById("t").value.trim(),adresse=document.getElementById("a").value.trim(),credit=Number(document.getElementById("c").value||0);
 if(!nom)return alert("Le nom est obligatoire.");
 let {error}=await sb.from("clients").insert({nom,tel,adresse,credit_initial:credit});
 if(error)return alert(error.message);closeModal();await loadData()
}
function addCredit(id){let c=clients.find(x=>x.id===id);openModal(`<h2>Ajouter un crédit — ${esc(c.nom)}</h2><input id="cm" type="number" min="0.01" step="0.01" placeholder="Montant du crédit"><br><br><div class="actions"><button onclick="saveCredit(${id})">Ajouter</button><button class="light" onclick="closeModal()">Annuler</button></div>`)}
async function saveCredit(id){let m=Number(document.getElementById("cm").value);if(!(m>0))return alert("Montant invalide.");let c=clients.find(x=>x.id===id);let nouveau=Number(c.credit_initial||0)+m;let {error}=await sb.from("clients").update({credit_initial:nouveau}).eq("id",id);if(error)return alert(error.message);closeModal();await loadData()}
function addPayment(id){let c=clients.find(x=>x.id===id);openModal(`<h2>Paiement — ${esc(c.nom)}</h2><input id="pm" type="number" min="0.01" step="0.01" placeholder="Montant"><br><br><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"><br><br><input id="pn" placeholder="Note (facultatif)"><br><br><div class="actions"><button onclick="savePayment(${id})">Enregistrer</button><button class="light" onclick="closeModal()">Annuler</button></div>`)}
async function savePayment(id){
 let m=Number(document.getElementById("pm").value),d=document.getElementById("pd").value,n=document.getElementById("pn").value.trim();
 if(!(m>0))return alert("Montant invalide.");
 let {error}=await sb.from("paiements").insert({client_id:id,montant:m,date_paiement:d,note:n});
 if(error)return alert(error.message);closeModal();await loadData()
}
function history(id){let c=clients.find(x=>x.id===id),ps=payments.filter(x=>x.client_id===id);openModal(`<h2>Historique — ${esc(c.nom)}</h2>${ps.length?ps.map(p=>`<div class="card"><b>${money(p.montant)}</b> — ${esc(p.date_paiement)}<br><span class="muted">${esc(p.note||"")}</span><br><br><button class="danger" onclick="deletePayment(${p.id})">Annuler ce paiement</button></div>`).join(""):"<p>Aucun paiement.</p>"}<button class="light" onclick="closeModal()">Fermer</button>`)}
async function deletePayment(id){if(!confirm("Annuler ce paiement ?"))return;let {error}=await sb.from("paiements").delete().eq("id",id);if(error)return alert(error.message);closeModal();await loadData()}
function editClient(id){let c=clients.find(x=>x.id===id);openModal(`<h2>Modifier client</h2><div class="grid"><input id="en" value="${esc(c.nom)}"><input id="et" value="${esc(c.tel||"")}"><input id="ea" value="${esc(c.adresse||"")}"><input id="ec" type="number" min="0" step="0.01" value="${Number(c.credit_initial||0)}"></div><br><div class="actions"><button onclick="updateClient(${id})">Enregistrer</button><button class="light" onclick="closeModal()">Annuler</button></div>`)}
async function updateClient(id){let nom=document.getElementById("en").value.trim(),tel=document.getElementById("et").value.trim(),adresse=document.getElementById("ea").value.trim(),credit=Number(document.getElementById("ec").value||0);if(!nom)return alert("Le nom est obligatoire.");let {error}=await sb.from("clients").update({nom,tel,adresse,credit_initial:credit}).eq("id",id);if(error)return alert(error.message);closeModal();await loadData()}
async function deleteClient(id){if(!confirm("Supprimer ce client et son historique de paiements ?"))return;let {error}=await sb.from("clients").delete().eq("id",id);if(error)return alert(error.message);await loadData()}
function receipt(id){let c=clients.find(x=>x.id===id),s=sums(c);let ps=payments.filter(x=>x.client_id===id);let w=window.open("","_blank");w.document.write(`<html><body style="font-family:Arial;padding:25px"><h2>Ma Caisse — Reçu</h2><h3>${esc(c.nom)}</h3><p>Téléphone : ${esc(c.tel||"")}</p><p>Crédit initial : ${money(c.credit_initial)}</p><p>Total payé : ${money(s.p)}</p><p><b>Reste : ${money(s.r)}</b></p><hr>${ps.map(p=>`<p>${esc(p.date_paiement)} — ${money(p.montant)} ${esc(p.note||"")}</p>`).join("")}<script>window.print()<\/script></body></html>`);w.document.close()}
function exporter(){let data=clients.map(c=>{let s=sums(c);return {id:c.id,nom:c.nom,tel:c.tel,adresse:c.adresse,credit:Number(c.credit_initial),paye:s.p,paiements:payments.filter(p=>p.client_id===c.id).map(p=>({id:p.id,date:p.date_paiement,montant:Number(p.montant),note:p.note||""}))}});let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="ma-caisse-sauvegarde.json";a.click()}
async function importer(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());for(let c of data){let {data:nc,error}=await sb.from("clients").insert({nom:c.nom||"Sans nom",tel:c.tel||"",adresse:c.adresse||"",credit_initial:Number(c.credit||c.credit_initial||0)}).select().single();if(error)throw error;for(let p of (c.paiements||[])){let d=(p.date||"").slice(0,10)||new Date().toISOString().slice(0,10);let r=await sb.from("paiements").insert({client_id:nc.id,montant:Number(p.montant),date_paiement:d,note:p.note||""});if(r.error)throw r.error}}await loadData();alert("Import terminé.")}catch(err){alert("Erreur import : "+err.message)}e.target.value=""}
async function syncLocal(){
 let data=localData();if(!data.length)return alert("Aucune ancienne donnée trouvée sur cet appareil.");
 if(!confirm("Importer les données locales dans le compte Supabase ? Ne clique qu'une seule fois."))return;
 try{for(let c of data){let {data:nc,error}=await sb.from("clients").insert({nom:c.nom||"Sans nom",tel:c.tel||"",adresse:c.adresse||"",credit_initial:Number(c.credit||0)}).select().single();if(error)throw error;for(let p of (c.paiements||[])){let d=(p.date||"").slice(0,10)||new Date().toISOString().slice(0,10);let r=await sb.from("paiements").insert({client_id:nc.id,montant:Number(p.montant||0),date_paiement:d,note:p.note||""});if(r.error)throw r.error}}await loadData();alert("Anciennes données importées avec succès. Garde encore ta sauvegarde locale.")}catch(e){alert("Erreur de synchronisation : "+e.message)}}
init();
</script>
</body>
</html>
